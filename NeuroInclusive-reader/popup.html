<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h3 {
      margin-top: 0;
      color: #333;
    }
    button {
      margin: 8px 0;
      padding: 8px 12px;
      width: 100%;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #0052a3;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      font-size: 12px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      font-weight: bold;
    }
    #result {
      margin-top: 10px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    #result.show {
      display: block;
    }
    .info {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 4px;
      border-left: 3px solid #0066cc;
    }
  </style>
</head>
<body>
  <h3>NeuroInclusive Tools</h3>
  
  <button id="bionic">Bionic Reading</button>
  <button id="focus">Focus Mode</button>
  <button id="summarize">AI Summary</button>
  
  <label>OpenAI API Key:</label>
  <input id="api-key" type="password" placeholder="AIza...">
  <button id="save-key">Save Key</button>
  
  <div id="status"></div>
  <div id="result"></div>
  
  
  <script src="popup.js"></script>
</body>
</html>
